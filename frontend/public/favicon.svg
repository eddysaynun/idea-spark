<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="sparkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#sparkGradient)" opacity="0.1"/>
  
  <!-- Spark Icon -->
  <g transform="translate(50, 50)">
    <!-- Main Spark -->
    <path d="M0,-35 L8,-15 L25,-15 L12,-5 L18,10 L0,0 L-18,10 L-12,-5 L-25,-15 L-8,-15 Z" 
          fill="url(#sparkGradient)" 
          stroke="url(#sparkGradient)" 
          stroke-width="2"/>
    
    <!-- Glow Effect -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#sparkGradient)" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="url(#sparkGradient)" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Text -->
  <text x="50" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" 
        fill="#7C3AED" text-anchor="middle" letter-spacing="1">IDEA SPARK</text>
</svg>
