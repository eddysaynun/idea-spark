[project]
name = "idea-generator-backend"
version = "2.0.0"
description = "AI-powered idea generator backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.109.0",
    "pydantic>=2.5.0",
    "aiohttp>=3.9.0",
    "tenacity>=8.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/routers", "src/schemas", "src/services", "src/utils"]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "uvicorn>=0.27.0",
    "workers-py>=1.7.0",
    "workers-runtime-sdk>=0.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
